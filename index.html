<style>

.cover{position:relative}
.badge{position:absolute;right:0;top:-6px;width:116px;transform:rotate(12deg)}

.arch{border-radius:999px 999px 20px 20px;padding-top:26px}
.circ{border-radius:50%}.rsq{border-radius:26px}.oval{border-radius:50%}
.bowl{border-radius:0 0 999px 999px;justify-content:flex-start;padding-top:18px}
.deco{pointer-events:none;flex:none}
.ov{display:grid;place-items:center;width:120px;height:62px;border-radius:50%;background:var(--n);border:2px solid var(--t);font:400 22px "Bagel Fat One";color:var(--t);transform:rotate(-12deg)}

<section class="card"><h3>My saved dates</h3><ul class="list">${s.map(x=>{const n=Math.round((new Date(x.date+'T00:00')-now)/864e5);return `<li class="row ${n<0?'past':''}"><input type="date" style="width:150px;flex:none" data-f="ds:${x.id}:date" value="${x.date}"><div class="txt"><input data-f="ds:${x.id}:t" value="${e(x.t)}"><input class="det" data-f="ds:${x.id}:n" value="${e(x.n)}" placeholder="Add a note"></div><span class="cd">${n<0?'Passed':n===0?'Today':n===1?'Tomorrow':'In '+n+' days'}</span><button class="sq s" data-a="rmd" data-v="${x.id}" aria-label="Delete">✕</button></li>`}).join('')}</ul>${s.length?'':'<p>No saved dates yet.</p>'}</section>`+jump()},
me(){const l=L(cur);l.pr=l.pr||{};const n=new Date(mo.y,mo.m+1,0).getDate(),np=PR.filter(p=>l.pr[p[0]]).length;
const dl=b=>{const t=new Date(TODAY+'T00:00'),mm=+b.d.slice(5,7)-1,dd=+b.d.slice(8,10);let x=new Date(t.getFullYear(),mm,dd);if(x<t)x=new Date(t.getFullYear()+1,mm,dd);return Math.round((x-t)/864e5)};

<section class="card"><h3>Water</h3><div class="cups">${[...Array(8)].map((_,i)=>`<button class="cup2 ${i<l.water?'f':''}" data-a="wt" data-v="${i}" aria-label="Glass ${i+1}"><svg viewBox="0 0 44 62" aria-hidden="true"><path class="g" d="M5 4h34l-4.5 50q-.4 5-5 5h-15q-4.6 0-5-5Z"/><path class="w" d="M7 22h30l-2.8 32q-.4 4-4 4H13.8q-3.6 0-4-4Z"/></svg></button>`).join('')}</div><p class="mini">${l.water} of 8 glasses. Tap a glass each time you drink one.</p></section>

<section class="card"><h3>My prayers</h3><div class="prs">${PR.map(p=>`<button class="pr ${l.pr[p[0]]?'on':''}" data-a="pr" data-v="${p[0]}"><i></i>${p[1]}</button>`).join('')}</div><p class="mini" style="margin-top:8px">${np} of 5 prayers</p></section>
<button class="card" data-a="pg" data-v="weight"><span><span class="big" style="display:block">My weight and calories</span><span class="mini">${l.kg?'Today: '+e(l.kg)+' kg · ':''}Tap to open the table</span></span><span class="go">›</span></button>
<section class="card dk"><h3>New things today</h3><div class="add"><input id="nw" placeholder="Something new I did" data-enter="#nb"><button class="pill hot" id="nb" data-a="addn">Add</button></div><ul class="list">${l.nw.map(w=>`<li class="row"><b style="flex:1;color:var(--c)">${e(w.n)}</b><button class="sq s" data-a="rmn" data-v="${w.id}" aria-label="Delete">✕</button></li>`).join('')}</ul></section>
<section class="card"><h3>Birthdays</h3><div class="add"><input id="bn" placeholder="Name" data-enter="#bb"><input id="bd" type="date" style="flex:0 1 150px" aria-label="Birthday"><button class="pill" id="bb" data-a="addb">Add</button></div><ul class="list">${[...S.bd].sort((a,b)=>dl(a)-dl(b)).map(b=>{const k=dl(b);return `<li class="row sm"><input data-f="bn:${b.id}" value="${e(b.n)}"><span class="cd">${fd(b.d,{day:'numeric',month:'short'})}</span><span class="cd">${k===0?'Today!':k===1?'Tomorrow':'In '+k+' days'}</span><button class="sq s" data-a="rmb" data-v="${b.id}" aria-label="Delete">✕</button></li>`}).join('')}</ul></section>
<section class="card"><h3>How do I feel?</h3><div class="moods">${MOODS.map(o=>`<button class="mood ${l.mood===o[0]?'on':''}" data-a="md" data-v="${o[0]}"><i style="background:${o[2]}"></i>${o[1]}</button>`).join('')}</div>
<div class="bar" style="margin:16px 0 0"><button class="sq s" data-a="mm" data-v="-1" aria-label="Previous month">‹</button><b>${new Date(mo.y,mo.m,1).toLocaleDateString('en-GB',{month:'long'})} mood</b><button class="sq s" data-a="mm" data-v="1" aria-label="Next month">›</button></div>
<div class="strip2">${[...Array(n)].map((_,i)=>{const d=key(new Date(mo.y,mo.m,i+1)),o=MOODS.find(o=>o[0]===(S.life[d]||{}).mood);return `<i title="${i+1}" style="${o?'background:'+o[2]:''}"></i>`}).join('')}</div></section>`+jump()},
weight(){const{y,m}=mo,n=new Date(y,m+1,0).getDate();
const rows=[...Array(n)].map((_,i)=>{const d=key(new Date(y,m,i+1)),l=S.life[d]||{};return `<tr class="${d===TODAY?'now':''}"><td>${fd(d,{weekday:'short'})}</td><td>${fd(d,{day:'numeric',month:'short'})}</td><td data-l="Calories"><input type="number" min="0" inputmode="numeric" aria-label="Calories, day ${i+1}" data-f="cal:${d}" value="${l.cal||''}"></td><td data-l="Weight"><input type="number" min="0" step="0.01" inputmode="decimal" aria-label="Weight in kg, day ${i+1}" data-f="kg:${d}" value="${l.kg||''}"></td><td class="chg" data-l="Change" data-d="${d}">${chgHtml(d)}</td></tr>`}).join('');
return head('My weight table',new Date(y,m,1).toLocaleDateString('en-GB',{month:'long',year:'numeric'}),'paw',mBar(new Date(y,m,1).toLocaleDateString('en-GB',{month:'long'})))+`<section class="card"><h3>My change this month</h3><p class="big" id="wsum">${sumTxt()}</p><p class="mini">Weight goes up and down a little every day. The whole month matters more.</p></section>
<section class="card"><div class="sc"><table class="tbw"><thead><tr><th>Day</th><th>Date</th><th>Calories</th><th>Weight (kg)</th><th>Change</th></tr></thead><tbody>${rows}</tbody></table></div></section>`+jump()}};
const fit=el=>{el.style.height='auto';el.style.height=el.scrollHeight+'px'};
const fitAll=()=>document.querySelectorAll('textarea.tt').forEach(fit);
document.addEventListener('input',ev=>{if(ev.target.matches&&ev.target.matches('textarea.tt'))fit(ev.target)});
let wScroll=false;
function render(){document.body.dataset.pg=pg;$('#v').innerHTML=(STORE_OK?'':'<p class="nosave">This browser is not saving your changes. Open the planner in a normal (not private) Safari tab to keep them.</p>')+V[pg]();fitAll();if(wScroll){wScroll=false;const n=$('tr.now');if(n)setTimeout(()=>n.scrollIntoView({block:'center'}),60)}}
const val=i=>($(i).value||'').trim(),mv=(a,id,d)=>{const i=a.findIndex(x=>x.id===id),j=i+d;if(j>=0&&j<a.length)[a[i],a[j]]=[a[j],a[i]]};
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v||'',[l,id]=v.split(':'),arr=()=>LST(l);let f='';
if(a==='pg'){pg=v;scrollTo(0,0);wScroll=(v==='weight')}
else if(a==='dd')cur=shift(cur,+v);
else if(a==='tdy'){cur=TODAY;mo={y:new Date().getFullYear(),m:new Date().getMonth()}}
else if(a==='addt'){const t=val('#nt');if(t)T(cur).push({id:uid(),t,d:val('#nd'),x:0});f='#nt'}
else if(a==='addwt'){const t=val('#wk_t');if(t)W(cur).push({id:uid(),t,type:$('#wk_y').value,d:'',x:0});f='#wk_t'}
else if(a==='addm'){const t=val('#mt_t');if(t)M(cur).push({id:uid(),t,kind:$('#mt_k').value,time:$('#mt_h').value,x:0});f='#mt_t'}
else if(a==='tg'){const t=arr().find(x=>x.id===id);t.x=t.x?0:1}
else if(a==='up')mv(arr(),id,-1);
else if(a==='dn')mv(arr(),id,1);
else if(a==='rm'){const r=arr();r.splice(r.findIndex(x=>x.id===id),1)}
else if(a==='carry'){const nx=shift(cur,1),A=LST(v),u=A.filter(x=>!x.x),k=A.filter(x=>x.x);A.length=0;k.forEach(x=>A.push(x));u.forEach(x=>LST(v,nx).push(x));cur=nx}
else if(a==='mm'){mo.m+=+v;if(mo.m<0){mo.m=11;mo.y--}if(mo.m>11){mo.m=0;mo.y++}}
else if(a==='open'){cur=v;pg='today';scrollTo(0,0)}
else if(a==='addw'){const t=val('#a_'+v);if(t)S.ach[v].push({id:uid(),t});f='#a_'+v}
else if(a==='mvw'){const o=l==='done'?'want':'done',i=S.ach[l].findIndex(x=>x.id===id);S.ach[o].push(S.ach[l].splice(i,1)[0])}
else if(a==='rmw')S.ach[l]=S.ach[l].filter(x=>x.id!==id);
else if(a==='addd'){const t=val('#dd_t'),d=$('#dd_d').value;if(t&&d)S.dates.push({id:uid(),date:d,t,n:val('#dd_n')});f='#dd_t'}
else if(a==='rmd')S.dates=S.dates.filter(x=>x.id!==v);
else if(a==='wt'){const x=L(cur);x.water=x.water===+v+1?+v:+v+1}
else if(a==='addk'){const n=val('#wn');if(n)L(cur).work.push({id:uid(),n,m:val('#wm')});f='#wn'}
else if(a==='rmk')L(cur).work=L(cur).work.filter(x=>x.id!==v);
else if(a==='addn'){const n=val('#nw');if(n)L(cur).nw.push({id:uid(),n});f='#nw'}
else if(a==='rmn')L(cur).nw=L(cur).nw.filter(x=>x.id!==v);
else if(a==='md'){const x=L(cur);x.mood=x.mood===v?'':v}
else if(a==='pr'){const x=L(cur);x.pr=x.pr||{};x.pr[v]=x.pr[v]?0:1}
else if(a==='addb'){const n=val('#bn'),d=$('#bd').value;if(n&&d)S.bd.push({id:uid(),n,d});f='#bn'}
else if(a==='rmb')S.bd=S.bd.filter(x=>x.id!==v);
save();render();if(f)$(f).focus()});
document.addEventListener('change',ev=>{const f=ev.target.dataset.f;if(!f)return;const p=f.split(':'),x=ev.target.value;
if(p[0]==='ti'||p[0]==='de'){LST(p[1]).find(i=>i.id===p[2])[p[0]==='ti'?'t':'d']=x}
else if(p[0]==='at'){S.ach[p[1]].find(i=>i.id===p[2]).t=x}
else if(p[0]==='ds'){S.dates.find(i=>i.id===p[1])[p[2]]=x;if(p[2]==='date'){save();render();return}}
else if(p[0]==='note')S.notes[cur]=x;
else if(p[0]==='walk')L(cur).walk=+x||0;
else if(p[0]==='kg'||p[0]==='cal'){L(p[1])[p[0]]=x;save();refW();return}
else if(p[0]==='bn'){S.bd.find(i=>i.id===p[1]).n=x}
save()});
document.addEventListener('keydown',ev=>{if(ev.target.classList&&ev.target.classList.contains('tt')&&ev.key==='Enter'){ev.preventDefault();ev.target.blur();return}
const s=ev.target.dataset&&ev.target.dataset.enter;if(s&&ev.key==='Enter')$(s).click()});
render();
/* ---- sync between devices (claude.ai db) ---- */
const isObj=x=>x&&typeof x==='object'&&!Array.isArray(x);
function merge(a,b){
if(Array.isArray(a)&&Array.isArray(b)){const ids=new Set(a.map(x=>x&&x.id));return a.concat(b.filter(x=>x&&x.id&&!ids.has(x.id)))}
if(isObj(a)&&isObj(b)){const o={};for(const k of new Set([...Object.keys(a),...Object.keys(b)]))o[k]=k in a?(k in b?merge(a[k],b[k]):a[k]):b[k];return o}
return(a===undefined||a===null||a===''||a===0)?(b===undefined?a:b):a}
const norm=o=>Object.assign({notes:{},tasks:{},work:{},meet:{},bd:[],ach:{done:[],want:[]},dates:[],life:{}},isObj(o)?o:{});
const setSync=t=>{const el=$('#sync');if(el)el.textContent=t};
const editing=()=>{const a=document.activeElement;return !!(a&&a.matches&&a.matches('input,textarea')&&a.value!==a.defaultValue)};
function queueWrite(){if(!DBDOC||!INIT)return;setSync('Saving…');clearTimeout(wTimer);wTimer=setTimeout(flush,700)}
async function flush(){wTimer=null;if(writing){again=true;return}writing=true;
try{const j=JSON.stringify(S);lastJ=j;await DBDOC.set({app:'nona-planner',json:j});setSync('Synced ✓')}
catch(_){setSync('Could not sync. Your changes are saved on this device.')}
writing=false;if(again){again=false;queueWrite()}}
function applyRemote(j,tries=0){if(j!==pendRemote||wTimer||writing)return;
if(editing()&&tries<40){setTimeout(()=>applyRemote(j,tries+1),1500);return}
try{S=norm(JSON.parse(j))}catch(_){return}
lastJ=j;try{localStorage.setItem(K,j)}catch(_){}render();setSync('Synced ✓')}
(async()=>{try{
if(!(window.claude&&claude.use)){setSync('Saved on this device');return}
const[db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
const uid=user?await user.id():null;
if(!db||!uid){setSync('Saved on this device only. Sign in to claude.ai to sync.');return}
DBDOC=db.doc('data/users/'+uid+'/planner');setSync('Syncing…');
const snap=await DBDOC.get();let j=null;
if(snap.exists){const d=snap.data();if(d&&typeof d.json==='string')j=d.json}
let remote=null;try{remote=j?JSON.parse(j):null}catch(_){}
S=remote?norm(merge(remote,S)):S;
const mj=JSON.stringify(S);try{localStorage.setItem(K,mj)}catch(_){}
INIT=true;lastJ=j||'';
if(mj!==j)await flush();else setSync('Synced ✓');
if(!editing())render();
DBDOC.onSnapshot(sn=>{if(!INIT||sn.metadata.fromCache||sn.metadata.hasPendingWrites||!sn.exists)return;const d=sn.data();
if(!d||typeof d.json!=='string'||d.json===lastJ)return;pendRemote=d.json;applyRemote(d.json)},()=>{setSync('Sync stopped. Reload the page.')});
}catch(_){setSync('Saved on this device only.')}})();

/* ---- move data between devices by code ---- */
(()=>{const B=id=>document.getElementById(id),enc=o=>'NONA1:'+btoa(unescape(encodeURIComponent(JSON.stringify(o)))),dec=t=>JSON.parse(decodeURIComponent(escape(atob(t.trim().replace(/^NONA1:/,'')))));
B('bkbtn').addEventListener('click',()=>{const p=B('bkp');p.hidden=!p.hidden});
B('bkcopy').addEventListener('click',async()=>{const code=enc(S),ta=B('bkta');ta.value=code;
try{await navigator.clipboard.writeText(code);B('bkmsg').textContent='Copied. Now paste it on your other device.'}
catch(_){ta.focus();ta.select();B('bkmsg').textContent='Select all the text in the box and copy it.'}});
B('bkadd').addEventListener('click',()=>{const t=B('bkta').value;if(!t.trim().startsWith('NONA1:')){B('bkmsg').textContent='This is not a Nona data code. Copy it again from your other device.';return}
try{S=norm(merge(dec(t),S));save();render();B('bkmsg').textContent='Done! Your data from both devices is now together.'}
catch(_){B('bkmsg').textContent='This code looks cut off. Copy it again from your other device.'}})})();
</script></body></html>
